<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
<header><i></i><b>Mockup Studio</b><span class="mu" id="info"></span><span class="sp"></span><button class="btn" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button><button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><select id="selModel" aria-label="Product model" style="width:auto;margin:0"></select><button class="btn" id="bLabel">Upload label</button><button class="btn p" id="bExp">Export PNG</button>
<input type="file" id="fModel" accept=".glb,.gltf" hidden><input type="file" id="fLabel" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="fBg" accept="image/*" hidden><input type="file" id="fProj" accept=".json" hidden></header>
<main><aside><div class="tabs" id="tabs"></div><div id="panes"></div></aside>
<div id="vp"><div id="bgov" style="position:absolute;inset:0;pointer-events:none"></div><div id="tools"></div><div id="empty"><div><b style="font-size:15px;color:var(--tx)">Loading the product model…</b><br>then upload your label image</div></div><div id="load">Loading…</div><div id="toast"></div></div></main></div>
<script>
/* Loads three.js + add-ons from the CDN; falls back to /vendor if the CDN is blocked; then starts js/app.js */
(function(){
  var L=[
    ['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','vendor/three.min.js'],
    ['https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js','vendor/OrbitControls.js'],
    ['https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','vendor/GLTFLoader.js'],
    ['js/app.js']
  ];
  function load(i){
    if(i>=L.length)return;
    var k=0;
    (function t(){
      var s=document.createElement('script');s.src=L[i][k];
      s.onload=function(){load(i+1)};
      s.onerror=function(){if(++k<L[i].length)t();else{console.error('Failed to load '+L[i][0]);load(i+1)}};
      document.head.appendChild(s);
    })();
  }
  load(0);
})();
</script>
</body>
</html>
